<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa budynku</title>
  <style>
    /* Zmienne hosta (MCP Apps) z wartościami domyślnymi, gdy host ich nie przekaże. */
    :root {
      --bg: var(--color-background-primary, #ffffff);
      --fg: var(--color-text-primary, #0f172a);
      --muted: var(--color-text-secondary, #64748b);
      --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
      color-scheme: light dark;
    }
    :root[data-theme="dark"] {
      --bg: var(--color-background-primary, #1e1e1e);
      --fg: var(--color-text-primary, #f1f5f9);
      --muted: var(--color-text-secondary, #94a3b8);
    }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font); }
    #status { padding: 12px; color: var(--muted); }
    #status.error { color: #dc2626; }
    svg { display: block; width: 100%; height: auto; }
    .label { font-size: 11px; fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
    .label.minor { fill: var(--muted); }
    .label.entrance { font-weight: 700; fill: #1d4ed8; }
    #pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; }
    #pick[hidden] { display: none; }
    #pick-text { flex: 1 1 200px; }
    #pick-text.error { color: #dc2626; }
    #pick button { font: inherit; padding: 4px 12px; cursor: pointer; }
    #pick button:disabled { cursor: default; }
    svg.picking { cursor: crosshair; }
  </style>
</head>
<body>
<!-- Widget pokazuje tylko mapę; nazwę budynku i wejście model podaje w tekście odpowiedzi. -->
<div id="status">Oczekiwanie na wynik narzędzia…</div>
<div id="pick" hidden>
  <span id="pick-text" role="status"></span>
  <button id="pick-confirm" type="button" disabled>Zatwierdź</button>
  <button id="pick-unknown" type="button">Nie wiem</button>
</div>
<svg id="map" hidden></svg>
<script>
  // ---------- JSON-RPC przez postMessage z hostem MCP Apps ----------

  const pending = new Map();
  let nextId = 1;
  let hostCapabilities = {};

  function send(message) { window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*'); }

  function request(method, params) {
    const id = nextId++;
    send({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }

  window.addEventListener('message', event => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== '2.0') return;

    if (msg.id !== undefined && !msg.method) {              // odpowiedź na nasze żądanie
      const p = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? p?.reject(msg.error) : p?.resolve(msg.result);
      return;
    }

    switch (msg.method) {
      case 'ui/notifications/tool-result': renderResult(msg.params); break;
      case 'ui/notifications/tool-cancelled': setStatus('Wywołanie narzędzia anulowano.', true); break;
      case 'ui/notifications/host-context-changed': applyHostContext(msg.params); break;
    }
    if (msg.id !== undefined && msg.method) send({ id: msg.id, result: {} });  // np. ping, ui/resource-teardown
  });

  function applyHostContext(context) {
    if (!context) return;
    if (context.theme) document.documentElement.dataset.theme = context.theme;
    for (const [name, value] of Object.entries(context.styles?.variables ?? {}))
      if (value) document.documentElement.style.setProperty(name, value);
  }

  new ResizeObserver(() => {
    const { width, height } = document.documentElement.getBoundingClientRect();
    send({ method: 'ui/notifications/size-changed', params: { width: Math.ceil(width), height: Math.ceil(height) } });
  }).observe(document.documentElement);

  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'tupzak-building-map', version: '1.0.0' },
    appCapabilities: {},
  }).then(result => {
    hostCapabilities = result?.hostCapabilities ?? {};
    applyHostContext(result?.hostContext);
    send({ method: 'ui/notifications/initialized', params: {} });
  }).catch(error => setStatus(`Błąd inicjalizacji: ${error?.message ?? error}`, true));

  // ---------- rysowanie GeoJSON (lokalne współrzędne w metrach, y rośnie na północ) ----------

  const styles = {
    building: { stroke: '#334155', width: 2, fill: '#cbd5e1' },
    parking: { stroke: '#6b7280', width: 2, dash: '6 4', fill: '#e5e7eb' },
    courtyard: { stroke: '#16a34a', width: 2, fill: '#bbf7d0' },
    path: { stroke: '#a16207', width: 3, dash: '6 6', fill: 'none' },
  };

  function setStatus(text, isError = false) {
    const status = document.getElementById('status');
    status.textContent = text;
    status.className = isError ? 'error' : '';
    status.hidden = !text;
  }

  function renderResult(result) {
    const text = (result?.content ?? []).filter(c => c.type === 'text').map(c => c.text).join('');
    if (result?.isError) {
      let message = text;
      try { message = JSON.parse(text).error ?? text; } catch { }
      return setStatus(message || 'Narzędzie zwróciło błąd.', true);
    }
    const data = result?.structuredContent;
    if (!data?.geojson) return setStatus(text || 'Brak danych GeoJSON w wyniku narzędzia.', true);

    setStatus('');
    draw(data.geojson, data.entranceId);
    drawCoffeeMachine(data.coffeeMachine);
    if (data.mode === 'pick-coffee-machine') startPicking(data);
  }

  // ---------- wskazywanie ekspresu do kawy: odpowiednik elicitacji w widgecie ----------

  const svgNs = 'http://www.w3.org/2000/svg';
  const reportToolName = 'report_coffee_machine_location';
  let mapTransform = null;   // parametry ostatniego draw(), potrzebne do przeliczenia kliknięcia na metry
  let picking = null;        // { buildingId, name, point, busy } albo null poza trybem wskazywania

  const pickPanel = document.getElementById('pick');
  const pickText = document.getElementById('pick-text');
  const confirmButton = document.getElementById('pick-confirm');
  const unknownButton = document.getElementById('pick-unknown');

  function setPickText(text, isError = false) {
    pickText.textContent = text;
    pickText.className = isError ? 'error' : '';
  }

  function startPicking(data) {
    picking = { buildingId: data.buildingId, name: data.name, saved: data.coffeeMachine, point: null, busy: false };
    pickPanel.hidden = false;
    document.getElementById('map').classList.add('picking');
    setPickText(`Kliknij na mapie miejsce ekspresu do kawy: ${data.name}.`);
    updatePickButtons();
  }

  function stopPicking(text, isError = false) {
    picking = null;
    document.getElementById('map').classList.remove('picking');
    confirmButton.hidden = unknownButton.hidden = true;
    setPickText(text, isError);
  }

  function updatePickButtons() {
    confirmButton.disabled = !picking?.point || picking.busy;
    unknownButton.disabled = !!picking?.busy;
  }

  function toMapPoint(event) {
    const svg = document.getElementById('map');
    const view = new DOMPoint(event.clientX, event.clientY).matrixTransform(svg.getScreenCTM().inverse());
    const { minX, minY, s, pad, height } = mapTransform;
    const round = v => Math.round(v * 10) / 10;
    return { x: round(minX + (view.x - pad) / s), y: round(minY + (height - pad - view.y) / s) };
  }

  // Marker ma osobną grupę, więc przesuwanie wskazania nie wymaga ponownego rysowania mapy.
  function drawCoffeeMachine(point) {
    document.getElementById('coffee-machine')?.remove();
    if (!point || !mapTransform) return;

    const { minX, minY, s, pad, height } = mapTransform;
    const group = document.createElementNS(svgNs, 'g');
    group.id = 'coffee-machine';
    group.setAttribute('transform', `translate(${pad + (point.x - minX) * s} ${height - pad - (point.y - minY) * s})`);
    group.setAttribute('pointer-events', 'none');
    group.innerHTML = '<circle r="8" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>'
      + '<text class="label" y="-13" text-anchor="middle">Ekspres</text>';
    document.getElementById('map').appendChild(group);
  }

  document.getElementById('map').addEventListener('click', event => {
    if (!picking || picking.busy || !mapTransform) return;
    picking.point = toMapPoint(event);
    drawCoffeeMachine(picking.point);
    setPickText(`Wskazane miejsce: (${picking.point.x}; ${picking.point.y}) m. Zatwierdź albo kliknij inne miejsce.`);
    updatePickButtons();
  });

  confirmButton.addEventListener('click', async () => {
    if (!picking?.point || picking.busy) return;
    if (!hostCapabilities.serverTools)
      return setPickText('Ten host nie pozwala widgetowi zapisać wskazania. Opisz miejsce ekspresu w rozmowie.', true);

    picking.busy = true;
    updatePickButtons();
    setPickText('Zapisywanie…');

    let saved;
    try {
      saved = await request('tools/call', {
        name: reportToolName,
        arguments: { buildingId: picking.buildingId, x: picking.point.x, y: picking.point.y },
      });
    } catch (error) {
      return failPick(`Nie udało się zapisać wskazania: ${error?.message ?? error}`);
    }

    const text = (saved?.content ?? []).filter(c => c.type === 'text').map(c => c.text).join('');
    if (saved?.isError) {
      let message = text;
      try { message = JSON.parse(text).error ?? text; } catch { }
      return failPick(message || 'Nie udało się zapisać wskazania.');
    }

    const r = saved.structuredContent ?? {};
    const place = r.insideBuilding ? 'w budynku' : 'poza budynkiem';
    const answer = `Ekspres do kawy (${picking.name}) wskazano na mapie: x=${r.x}, y=${r.y} m, ${place}, `
      + `${r.nearestEntranceDistanceM} m od wejścia ${r.nearestEntranceId}.`;

    stopPicking('Zapisano wskazanie.');
    try {
      await sendToConversation(answer);
    } catch {
      // Zapis na serwerze już jest. Model dostanie kontekst w kolejnej turze, którą rozpocznie użytkownik.
      request('ui/update-model-context', { content: [{ type: 'text', text: answer }] }).catch(() => { });
      setPickText('Zapisano. Napisz w rozmowie, żeby kontynuować.');
    }
  });

  unknownButton.addEventListener('click', async () => {
    if (!picking || picking.busy) return;
    const { name } = picking;
    picking.busy = true;
    updatePickButtons();
    try {
      await sendToConversation(`Nie wiem, gdzie jest ekspres do kawy (${name}).`);
      drawCoffeeMachine(picking.saved);   // porzucone wskazanie znika, wcześniej zapisane zostaje
      stopPicking('Bez wskazania.');
    } catch (error) {
      failPick(`Nie udało się wysłać odpowiedzi: ${error?.message ?? error}. Napisz ją w rozmowie.`);
    }
  });

  function failPick(message) {
    picking.busy = false;
    updatePickButtons();
    setPickText(message, true);
  }

  function sendToConversation(text) {
    return request('ui/message', { role: 'user', content: { type: 'text', text } });
  }

  function draw(geojson, markedEntranceId) {
    const features = geojson.features ?? [];
    const rings = f => f.geometry.type === 'Polygon' ? f.geometry.coordinates
      : f.geometry.type === 'LineString' ? [f.geometry.coordinates] : [[f.geometry.coordinates]];
    const all = features.flatMap(f => rings(f).flat());
    const minX = Math.min(...all.map(p => p[0])), maxX = Math.max(...all.map(p => p[0]));
    const minY = Math.min(...all.map(p => p[1])), maxY = Math.max(...all.map(p => p[1]));

    const width = 640, pad = 40;
    const scale = (width - 2 * pad) / Math.max(maxX - minX, 1);
    const height = Math.min((maxY - minY) * scale + 2 * pad, 900);
    const s = Math.min(scale, (height - 2 * pad) / Math.max(maxY - minY, 1));
    const px = ([x, y]) => [pad + (x - minX) * s, height - pad - (y - minY) * s];
    const pts = coords => coords.map(p => px(p).map(v => v.toFixed(1)).join(',')).join(' ');
    mapTransform = { minX, minY, s, pad, height };

    const kindOrder = { parking: 0, courtyard: 1, path: 2, building: 3, landmark: 4, entrance: 5 };
    const sorted = [...features].sort((a, b) => (kindOrder[a.properties.kind] ?? 9) - (kindOrder[b.properties.kind] ?? 9));
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    const parts = sorted.map(f => {
      const { kind, id, name } = f.properties;
      const st = styles[kind] ?? {};
      const dash = st.dash ? ` stroke-dasharray="${st.dash}"` : '';
      const title = `<title>${esc(id)} · ${esc(name)}</title>`;

      if (f.geometry.type === 'Polygon') {
        const ring = f.geometry.coordinates[0];
        const vertices = ring.slice(0, -1);  // ostatni punkt pierścienia powtarza pierwszy
        const [cx, cy] = px([vertices.reduce((a, p) => a + p[0], 0) / vertices.length, vertices.reduce((a, p) => a + p[1], 0) / vertices.length]);
        const polygon = `<polygon points="${pts(ring)}" fill="${st.fill}" stroke="${st.stroke}" stroke-width="${st.width}"${dash}>${title}</polygon>`;
        if (kind === 'building') {
          // Nazwa nad obrysem (środek wielokąta w kształcie L może leżeć poza nim), jak w app.js.
          const [, top] = px([0, Math.max(...vertices.map(p => p[1]))]);
          const [left] = px([Math.min(...vertices.map(p => p[0])), 0]);
          return `<g>${polygon}<text class="label" x="${left}" y="${top - 8}">${esc(name)}</text></g>`;
        }
        return `<g>${polygon}<text class="label minor" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle">${esc(kind === 'parking' ? 'P' : name)}</text></g>`;
      }
      if (f.geometry.type === 'LineString')
        return `<polyline points="${pts(f.geometry.coordinates)}" fill="none" stroke="${st.stroke}" stroke-width="${st.width}"${dash}>${title}</polyline>`;

      const [x, y] = px(f.geometry.coordinates);
      if (kind === 'entrance') {
        const marked = id === markedEntranceId;
        return `<g>${marked ? `<circle cx="${x}" cy="${y}" r="16" fill="#1d4ed8" fill-opacity="0.2" stroke="#1d4ed8" stroke-width="2"/>` : ''}`
          + `<circle cx="${x}" cy="${y}" r="7" fill="${marked ? '#1d4ed8' : '#fff'}" stroke="#1d4ed8" stroke-width="3">${title}</circle>`
          + `<text class="label entrance" x="${x}" y="${y - (marked ? 20 : 12)}" text-anchor="middle">${esc(id)}</text></g>`;
      }
      return `<g><circle cx="${x}" cy="${y}" r="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2">${title}</circle>`
        + (x > width / 2  // etykieta po stronie środka mapy, żeby nie wychodziła poza krawędź
          ? `<text class="label minor" x="${x - 9}" y="${y}" text-anchor="end" dominant-baseline="middle">${esc(name)}</text></g>`
          : `<text class="label minor" x="${x + 9}" y="${y}" dominant-baseline="middle">${esc(name)}</text></g>`);
    });

    // Strzałka północy i podziałka 10 m.
    const bar = 10 * s;
    parts.push(`<g class="label minor"><text x="${width - 16}" y="20" text-anchor="middle">N</text>`
      + `<path d="M${width - 16} 24 l-5 12 h10 z" fill="currentColor"/></g>`
      + `<g><line x1="12" y1="${height - 12}" x2="${12 + bar}" y2="${height - 12}" stroke="currentColor" stroke-width="2"/>`
      + `<text class="label minor" x="${16 + bar}" y="${height - 12}" dominant-baseline="middle">10 m</text></g>`);

    const svg = document.getElementById('map');
    svg.setAttribute('viewBox', `0 0 ${width} ${height.toFixed(0)}`);
    svg.style.color = 'var(--muted)';
    svg.innerHTML = parts.join('');
    svg.hidden = false;
  }
</script>
</body>
</html>
